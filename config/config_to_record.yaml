# YAML used by ``blv-collect record-all``, ``blv-collect collect-all``,
# and ``blv-collect collect-classes``.  Mirrors the values the UI would
# use, so a CLI batch capture and a GUI batch capture write identical
# files to the same tree.

root_folder: "/media/shiven/NeurIPS_SSD/Synthetic_Data/collected_data"
asset_root_folder: "/media/shiven/NeurIPS_SSD/Synthetic_Data/synthetic_objects"
environments_folder: "/media/shiven/NeurIPS_SSD/Synthetic_Data/environments"

# Single-class commands (``record-all``, ``collect-all``) read this:
asset_class_name: "handrail"
environment: "hotel_corridor"
location: "hc1"

# Multi-class command (``collect-classes``) reads this list.  When set,
# ``collect-classes`` loops over each class.  When empty, it falls back
# to ``asset_class_name`` above (single-element list).
classes:
  - aps_button
  - bus_stop_sign
  - crosswalk
  - door_button
  - elevator
  - escalator
  - handrail
  - pedestrian_signal
  - turnstile


# Render settings.
resolution_width: 1280
resolution_height: 720
rt_subframes: 4
frame_step: 50 

# Camera + asset plumbing — rarely need changing.
camera_path: "/World/BLV_Camera"
parent_prim_path: "/World"
move_speed: 20.0
look_speed: 30.0
focal_length: 28.0   # in mm — USD uses "tenths of a scene unit"; see camera setup


annotators:
  rgb: true
  semantic_segmentation: true
  bounding_box_2d_tight: true
  colorize_semantic_segmentation: true
  bounding_box_3d: true
  normals: true
  distance_to_image_plane: true
